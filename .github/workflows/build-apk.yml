name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir extracted
          ARCHIVE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "File ZIP tidak ditemukan"
            exit 1
          fi
          unzip -q "$ARCHIVE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -print -quit)")
          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "File settings.gradle tidak ditemukan"
            exit 1
          fi
          cp -R "$PROJECT_DIR/app" .
          cp "$PROJECT_DIR/build.gradle" .
          cp "$PROJECT_DIR/settings.gradle" .
          cp "$PROJECT_DIR/gradle.properties" .

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-Joki-PB-APK
          path: app/build/outputs/apk/debug/app-debug.apk
